# configuration file
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download project code  # Just a text , can be written
        uses: actions/checkout@v4  # fix can't be changed as Default command

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install libraries/dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Test model
        run: python test.py
